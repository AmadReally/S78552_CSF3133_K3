<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2.3 Working with Tables</title>
</head>
<body>
    <h2>2.3 Working with Tables</h2>

    <h3>1. Basic Table Structure</h3>
    <table>
        <tr>
            <th>Name</th>
            <th>Subject</th>
            <th>Grade</th>
        </tr>
        <tr>
            <td>John Doe</td>
            <td>Mathematics</td>
            <td>A</td>
        </tr>
        <tr>
            <td>Jane Smith</td>
            <td>Science</td>
            <td>B+</td>
        </tr>
    </table>

    <h3>2. Attributes in Tables (border, colspan)</h3>
    <table border="1">
        <tr>
            <th colspan="2">Student Information</th>
        </tr>
        <tr>
            <td>Name</td>
            <td>John Doe</td>
        </tr>
        <tr>
            <td colspan="2">Mathematics A+</td>
        </tr>
    </table>

</body>
</html>
