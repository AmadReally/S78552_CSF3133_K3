<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Navigation Bar</title>
<style>
/* Step 8: horizontal navigation bar (final version).
   Steps 4 and 6 (no bullets, then vertical bar) were earlier versions of this same rule. */
ul {
  list-style-type: none;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background-color: #333;
}

li {
  float: left;
}

li a {
  display: block;
  color: white;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;
}

/* Change the link color to #111 (black) on hover */
li a:hover {
  background-color: #111;
}
</style>
</head>
<body>
    <ul>
      <li><a href="#home">Home</a></li>
      <li><a href="#news">News</a></li>
      <li><a href="#contact">Contact</a></li>
      <li><a href="#about">About</a></li>
    </ul>
</body>
</html>
