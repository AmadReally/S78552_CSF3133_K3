<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator</title>
    <!-- Part 2, step 9: link the new stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Student Grade Calculator</h1>

    <!-- Fixed (Error 1): onsubmit now uses "return" so a false result stops the form -->
    <form name="gradeForm" onsubmit="return checkMark()">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br>
        <label for="mark">Mark (0-100):</label>
        <input type="text" id="mark" name="mark"><br>
        <button type="submit">Check Grade</button>
        <!-- Part 2, step 7: Random Mark button (type="button" so it does not submit the form) -->
        <button type="button" onclick="randomMark()">Random Mark</button>
    </form>

    <p id="result"></p>
    <!-- Part 2, step 8: date and time of checking -->
    <p id="checkedOn"></p>

    <!-- Fixed (Error 2): the function name is showTable (capital T) -->
    <button type="button" onclick="showTable()">Show Grade Table</button>
    <div id="tableContainer"></div>

    <!-- Fixed (Error 3): the file is grade.js, not grades.js -->
    <script src="grade.js"></script>
</body>
</html>
